<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Pitch</title>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #cesiumContainer {
            width: 100%;
            height: 100%;
        }
        #toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #createPitchBtn {
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        #createPitchBtn:hover { background: #1976D2; }
        #createPitchBtn.active { background: #f44336; }
        #createPitchBtn.active:hover { background: #d32f2f; }
        #clearBtn {
            padding: 8px 16px;
            background: #607D8B;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        #clearBtn:hover { background: #455A64; }
        #dimsPanel {
            background: rgba(255,255,255,0.92);
            border-radius: 6px;
            padding: 8px 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #dimsPanel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        #dimsPanel input[type="number"] {
            width: 70px;
            padding: 3px 6px;
            border: 1px solid #90A4AE;
            border-radius: 4px;
            font-size: 13px;
        }
        #dimsPanel .checkboxRow {
            justify-content: flex-start;
        }
        #status {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="toolbar">
        <div id="dimsPanel">
            <label>縦(長辺) L: <input type="number" id="pitchLengthInput" value="68" min="10" max="200" step="0.5"> m</label>
            <label>横(短辺) W: <input type="number" id="pitchWidthInput" value="50" min="10" max="200" step="0.5"> m</label>
            <label class="checkboxRow"><input type="checkbox" id="dimLinesToggle" checked> 寸法線を表示</label>
        </div>
        <button id="createPitchBtn">ピッチ作成</button>
        <button id="clearBtn">クリア</button>
    </div>
    <div id="status" id="status"></div>
    <script>
        Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJiOGQ2OThiZS1hZDkzLTQ4MjktYTZjMC0zZTJiOTZkOWI2OWQiLCJpZCI6MjUyOTUyLCJzdWIiOiJZYXN1c2hpIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6IlRyZWUgUmlzayBBc3Nlc3NtZW50IiwiaWF0IjoxNzgxMjQzNzk5fQ.ZXeoSgsZYAA5dt2EmqdxAhRY8XUCUZQ7viJKCOASc5o";

        const viewer = new Cesium.Viewer("cesiumContainer", {
            animation: false,
            baseLayerPicker: false,
            geocoder: true,
            homeButton: true,
            infoBox: false,
            navigationHelpButton: false,
            sceneModePicker: false,
            timeline: false,
            fullscreenButton: false,
            terrain: new Cesium.Terrain(Cesium.CesiumTerrainProvider.fromIonAssetId(2767062)),
        });

        viewer.scene.globe.enableLighting = true;
        viewer.scene.globe.depthTestAgainstTerrain = false;
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(137.0, 37.5, 3500000),
            orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-90),
                roll: 0,
            },
        });

        // ─── Pitch dimensions (meters) ───────────────────────────────────────
        // PITCH_L / PITCH_W are editable at runtime via the size inputs in the
        // toolbar (see #pitchLengthInput / #pitchWidthInput below), so they are
        // declared with `let` instead of `const`.
        let PITCH_L = 68;   // long side  (x-axis in local coords)
        let PITCH_W = 50;   // short side (y-axis in local coords)

        // Penalty area
        const PA_DEPTH = 12;                            // from goal line along x
        const PA_WIDTH = 29;                            // centered on y=PITCH_W/2

        // Goal area
        const GA_DEPTH = 4;                             // from goal line along x
        const GA_WIDTH = 13;                            // goal area width

        // Goal mouth (for visual reference lines only – not a 3-D structure)
        const GOAL_WIDTH = 5;

        // Spots & circles
        const PEN_SPOT_X  = 8;   // penalty spot from goal line
        const PEN_ARC_R   = 7;    // penalty arc radius
        const CENTER_R    = 7;    // centre circle radius
        const CORNER_R    = 1;    // corner arc radius

        // Line width (Cesium pixels)
        const LW = 2;
        const LW_THICK = 3;

        // Stripe count along long axis
        const STRIPE_N = 8;

        // Dimension-line style
        const DIM_COLOR     = Cesium.Color.fromCssColorString("#ffd600"); // amber
        const DIM_EXT_COLOR = Cesium.Color.fromCssColorString("#ffd600").withAlpha(0.55);
        const DIM_TICK_LEN  = 1.2; // meters, length of the end tick marks

        // zIndex layering for ground-clamped primitives (higher draws on top,
        // avoids dimension lines being hidden behind the grass/markings).
        const Z_STRIPE = 0;
        const Z_MARKING = 1;
        const Z_DIMENSION = 10;


        // ─── State ───────────────────────────────────────────────────────────
        let clickMode  = false;
        let clickCount = 0;
        let points     = [];
        let tempMarkers = [];
        let pitchEntities = [];
        let currentPitchBasis = null;
        let rubberBandLine = null;
        let mouseCartesian = null;
        let dragState = null;

        const statusEl = document.getElementById("status");
        const btn      = document.getElementById("createPitchBtn");
        const clearBtn = document.getElementById("clearBtn");
        const lengthInput = document.getElementById("pitchLengthInput");
        const widthInput  = document.getElementById("pitchWidthInput");
        const dimLinesToggle = document.getElementById("dimLinesToggle");
        let showDimensions = dimLinesToggle.checked;

        // ─── UI helpers ──────────────────────────────────────────────────────
        function setStatus(msg) {
            if (msg) {
                statusEl.textContent = msg;
                statusEl.style.display = "block";
            } else {
                statusEl.style.display = "none";
            }
        }

        function addTempMarker(pos) {
            const e = viewer.entities.add({
                position: pos,
                point: {
                    pixelSize: 10,
                    color: Cesium.Color.YELLOW,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 2,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                    disableDepthTestDistance: Number.POSITIVE_INFINITY,
                }
            });
            tempMarkers.push(e);
        }

        function clearTempMarkers() {
            tempMarkers.forEach(e => viewer.entities.remove(e));
            tempMarkers = [];
        }

        function createRubberBandLine(fromPoint) {
            removeRubberBandLine();
            rubberBandLine = viewer.entities.add({
                polyline: {
                    positions: new Cesium.CallbackProperty(() => {
                        const to = mouseCartesian || fromPoint;
                        return [fromPoint, to];
                    }, false),
                    width: 2,
                    material: new Cesium.PolylineDashMaterialProperty({
                        color: Cesium.Color.YELLOW,
                        dashLength: 16,
                    }),
                    clampToGround: true,
                    classificationType: Cesium.ClassificationType.TERRAIN,
                }
            });
        }

        function createPerpendicularRubberBandLine(p1, p2) {
            removeRubberBandLine();
            // U = direction p1 → p2
            const diff = Cesium.Cartesian3.subtract(p2, p1, new Cesium.Cartesian3());
            const U = Cesium.Cartesian3.normalize(diff, new Cesium.Cartesian3());
            // Surface normal at p1
            const up = Cesium.Cartesian3.normalize(Cesium.Cartesian3.clone(p1), new Cesium.Cartesian3());
            // V = perpendicular to U in the tangent plane
            const V = Cesium.Cartesian3.normalize(
                Cesium.Cartesian3.cross(up, U, new Cesium.Cartesian3()),
                new Cesium.Cartesian3()
            );
            rubberBandLine = viewer.entities.add({
                polyline: {
                    positions: new Cesium.CallbackProperty(() => {
                        const mouse = mouseCartesian || p1;
                        const toMouse = Cesium.Cartesian3.subtract(mouse, p1, new Cesium.Cartesian3());
                        const dotV = Cesium.Cartesian3.dot(toMouse, V);
                        const endpoint = Cesium.Cartesian3.add(
                            p1,
                            Cesium.Cartesian3.multiplyByScalar(V, dotV, new Cesium.Cartesian3()),
                            new Cesium.Cartesian3()
                        );
                        return [p1, endpoint];
                    }, false),
                    width: 2,
                    material: new Cesium.PolylineDashMaterialProperty({
                        color: Cesium.Color.YELLOW,
                        dashLength: 16,
                    }),
                    clampToGround: true,
                    classificationType: Cesium.ClassificationType.TERRAIN,
                }
            });
        }

        function removeRubberBandLine() {
            if (rubberBandLine) {
                viewer.entities.remove(rubberBandLine);
                rubberBandLine = null;
            }
        }

        function clearPitch() {
            pitchEntities.forEach(e => viewer.entities.remove(e));
            pitchEntities = [];
            currentPitchBasis = null;
            dragState = null;
        }

        function getGroundPosition(screenPosition) {
            const ray = viewer.camera.getPickRay(screenPosition);
            if (!ray) return null;
            return viewer.scene.globe.pick(ray, viewer.scene);
        }

        function isPitchEntity(pickedObject) {
            return Boolean(
                pickedObject &&
                pickedObject.id &&
                pitchEntities.includes(pickedObject.id)
            );
        }

        function movePitchOrigin(startOrigin, startPoint, endPoint, basis) {
            const move = Cesium.Cartesian3.subtract(endPoint, startPoint, new Cesium.Cartesian3());
            const alongU = Cesium.Cartesian3.dot(move, basis.U);
            const alongV = Cesium.Cartesian3.dot(move, basis.V);
            const newOrigin = Cesium.Cartesian3.clone(startOrigin, new Cesium.Cartesian3());

            Cesium.Cartesian3.add(
                newOrigin,
                Cesium.Cartesian3.multiplyByScalar(basis.U, alongU, new Cesium.Cartesian3()),
                newOrigin
            );
            Cesium.Cartesian3.add(
                newOrigin,
                Cesium.Cartesian3.multiplyByScalar(basis.V, alongV, new Cesium.Cartesian3()),
                newOrigin
            );

            return newOrigin;
        }

        function cancelMode() {
            clickMode  = false;
            clickCount = 0;
            points     = [];
            mouseCartesian = null;
            clearTempMarkers();
            removeRubberBandLine();
            btn.textContent = "ピッチ作成";
            btn.classList.remove("active");
            setStatus(null);
            viewer.scene.screenSpaceCameraController.enableRotate    = true;
            viewer.scene.screenSpaceCameraController.enableTranslate = true;
            viewer.scene.screenSpaceCameraController.enableZoom      = true;
        }

        // ─── Button handlers ─────────────────────────────────────────────────
        btn.addEventListener("click", () => {
            if (clickMode) {
                cancelMode();
            } else {
                clickMode  = true;
                clickCount = 0;
                points     = [];
                btn.textContent = "キャンセル";
                btn.classList.add("active");
                setStatus("1点目をクリック（ピッチの角）");
            }
        });

        clearBtn.addEventListener("click", () => {
            cancelMode();
            clearPitch();
        });

        // ─── Pitch size inputs ───────────────────────────────────────────────
        function applyPitchSize(input, min, apply) {
            const value = parseFloat(input.value);
            if (!Number.isFinite(value) || value < min) {
                input.value = String(min);
                apply(min);
            } else {
                apply(value);
            }
            // Redraw the current pitch in place (without moving the camera)
            // so size changes are reflected immediately.
            if (currentPitchBasis) {
                renderPitch(currentPitchBasis, false);
            }
        }

        lengthInput.addEventListener("change", () => {
            applyPitchSize(lengthInput, 10, v => { PITCH_L = v; });
        });

        widthInput.addEventListener("change", () => {
            applyPitchSize(widthInput, 10, v => { PITCH_W = v; });
        });

        dimLinesToggle.addEventListener("change", () => {
            showDimensions = dimLinesToggle.checked;
            if (currentPitchBasis) {
                renderPitch(currentPitchBasis, false);
            }
        });

        // ─── Click handler ───────────────────────────────────────────────────
        viewer.screenSpaceEventHandler.setInputAction(click => {
            if (!clickMode) return;

            const pos = getGroundPosition(click.position);
            if (!pos) return;

            clickCount++;
            points.push(pos);
            addTempMarker(pos);

            if (clickCount === 1) {
                setStatus("2点目をクリック（長辺の方向・端点）");
                createRubberBandLine(points[0]);
            } else if (clickCount === 2) {
                setStatus("3点目をクリック（短辺の方向）");
                createPerpendicularRubberBandLine(points[0], points[1]);
            } else if (clickCount === 3) {
                removeRubberBandLine();
                clearTempMarkers();
                setStatus(null);
                drawPitch(points[0], points[1], points[2]);
                cancelMode();
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        viewer.screenSpaceEventHandler.setInputAction(click => {
            if (clickMode || !currentPitchBasis) return;

            const pickedObject = viewer.scene.pick(click.position);
            if (!isPitchEntity(pickedObject)) return;

            const dragStartPoint = getGroundPosition(click.position);
            if (!dragStartPoint) return;

            dragState = {
                startPoint: dragStartPoint,
                startOrigin: Cesium.Cartesian3.clone(currentPitchBasis.origin),
            };

            setStatus("ドラッグしてピッチを移動");
            viewer.scene.screenSpaceCameraController.enableRotate = false;
            viewer.scene.screenSpaceCameraController.enableTranslate = false;
        }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

        // ─── Mouse-move handler (rubber-band line) ─────────────────────────
        viewer.screenSpaceEventHandler.setInputAction(movement => {
            const pos = getGroundPosition(movement.endPosition);

            if (dragState && pos) {
                const nextBasis = {
                    ...currentPitchBasis,
                    origin: movePitchOrigin(dragState.startOrigin, dragState.startPoint, pos, currentPitchBasis),
                };
                renderPitch(nextBasis, false);
                return;
            }

            if (!clickMode || clickCount === 0) return;
            if (pos) mouseCartesian = pos;
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        viewer.screenSpaceEventHandler.setInputAction(() => {
            if (!dragState) return;

            dragState = null;
            setStatus(null);
            viewer.scene.screenSpaceCameraController.enableRotate = true;
            viewer.scene.screenSpaceCameraController.enableTranslate = true;
        }, Cesium.ScreenSpaceEventType.LEFT_UP);

        // ─── Coordinate helpers ──────────────────────────────────────────────
        /**
         * Build an orthonormal basis { U, V } in the tangent plane at p1.
         *  U = direction from p1 → p2 (long axis)
         *  V = perpendicular to U in tangent plane, on the side of p3
         */
        function buildBasis(p1, p2, p3) {
            const diff = Cesium.Cartesian3.subtract(p2, p1, new Cesium.Cartesian3());
            const U = Cesium.Cartesian3.normalize(diff, new Cesium.Cartesian3());

            // Surface normal (up) at p1
            const up = Cesium.Cartesian3.normalize(
                Cesium.Cartesian3.clone(p1), new Cesium.Cartesian3()
            );

            // Perpendicular to U in the tangent plane: V = normalize(up × U)
            let V = Cesium.Cartesian3.cross(up, U, new Cesium.Cartesian3());
            Cesium.Cartesian3.normalize(V, V);

            // Flip V if p3 is on the opposite side
            const toP3 = Cesium.Cartesian3.subtract(p3, p1, new Cesium.Cartesian3());
            if (Cesium.Cartesian3.dot(V, toP3) < 0) {
                Cesium.Cartesian3.negate(V, V);
            }

            return { U, V, origin: p1 };
        }

        /**
         * Convert local (x, y) → Cesium Cartesian3 world position.
         *  x = distance along long axis (0…68)
         *  y = distance along short axis (0…50)
         */
        function local2world(x, y, basis) {
            const { U, V, origin } = basis;
            const pt = Cesium.Cartesian3.clone(origin, new Cesium.Cartesian3());
            Cesium.Cartesian3.add(pt,
                Cesium.Cartesian3.multiplyByScalar(U, x, new Cesium.Cartesian3()), pt);
            Cesium.Cartesian3.add(pt,
                Cesium.Cartesian3.multiplyByScalar(V, y, new Cesium.Cartesian3()), pt);
            return pt;
        }

        /** Generate world positions for a polyline of local (x,y) points. */
        function localLine(localPts, basis) {
            return localPts.map(([x, y]) => local2world(x, y, basis));
        }

        /** Approximate a circular arc as polyline positions (local coords). */
        function arcPoints(cx, cy, r, a0, a1, steps, basis) {
            const pts = [];
            for (let i = 0; i <= steps; i++) {
                const a = a0 + (a1 - a0) * i / steps;
                pts.push(local2world(cx + r * Math.cos(a), cy + r * Math.sin(a), basis));
            }
            return pts;
        }

        /** Add a polyline entity clamped to ground. */
        function addLine(positions, color, width, zIndex) {
            const e = viewer.entities.add({
                polyline: {
                    positions,
                    width: width || LW,
                    material: color || Cesium.Color.WHITE,
                    clampToGround: true,
                    classificationType: Cesium.ClassificationType.TERRAIN,
                    zIndex: zIndex || 0,
                }
            });
            pitchEntities.push(e);
            return e;
        }

        /** Add a filled polygon entity clamped to ground. */
        function addPolygon(positions, color, zIndex) {
            const e = viewer.entities.add({
                polygon: {
                    hierarchy: new Cesium.PolygonHierarchy(positions),
                    material: color,
                    classificationType: Cesium.ClassificationType.TERRAIN,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                    zIndex: zIndex || 0,
                }
            });
            pitchEntities.push(e);
            return e;
        }

        // ─── Dimension lines (CAD-style: extension lines + end ticks + label) ─
        /** Add a text label (with white background) clamped to the ground. */
        function addDimLabel(x, y, text, basis) {
            const e = viewer.entities.add({
                position: local2world(x, y, basis),
                label: {
                    text,
                    font: "bold 14px sans-serif",
                    fillColor: Cesium.Color.BLACK,
                    showBackground: true,
                    backgroundColor: Cesium.Color.WHITE.withAlpha(0.8),
                    backgroundPadding: new Cesium.Cartesian2(4, 2),
                    style: Cesium.LabelStyle.FILL,
                    verticalOrigin: Cesium.VerticalOrigin.CENTER,
                    horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                    disableDepthTestDistance: Number.POSITIVE_INFINITY,
                    scaleByDistance: new Cesium.NearFarScalar(150, 1.0, 4000, 0.35),
                }
            });
            pitchEntities.push(e);
            return e;
        }

        /**
         * Draw a linear dimension between local points p1 → p2, offset away
         * from the measured feature by `offset` (a local [dx, dy] vector, in
         * meters), with extension lines, end ticks and a text label.
         * `labelFrac` (0..1) positions the label along the line; defaults to
         * the midpoint, but can be shifted so nested/stacked dimensions that
         * share the same centre don't overlap each other's labels.
         */
        function addLinearDimension(p1, p2, offset, text, basis, labelFrac) {
            const frac = labelFrac === undefined ? 0.5 : labelFrac;
            const d1 = [p1[0] + offset[0], p1[1] + offset[1]];
            const d2 = [p2[0] + offset[0], p2[1] + offset[1]];

            // Extension lines connecting the real points to the offset dimension line
            addLine(localLine([p1, d1], basis), DIM_EXT_COLOR, 1, Z_DIMENSION);
            addLine(localLine([p2, d2], basis), DIM_EXT_COLOR, 1, Z_DIMENSION);

            // Main dimension line
            addLine(localLine([d1, d2], basis), DIM_COLOR, LW, Z_DIMENSION);

            // Perpendicular end ticks
            const dx = d2[0] - d1[0], dy = d2[1] - d1[1];
            const len = Math.hypot(dx, dy) || 1;
            const px = -dy / len, py = dx / len; // unit perpendicular
            const h = DIM_TICK_LEN / 2;
            [d1, d2].forEach(d => {
                addLine(localLine([
                    [d[0] + px * h, d[1] + py * h],
                    [d[0] - px * h, d[1] - py * h],
                ], basis), DIM_COLOR, LW, Z_DIMENSION);
            });

            // Label positioned along the line (defaults to the midpoint)
            const mid = [d1[0] + (d2[0] - d1[0]) * frac, d1[1] + (d2[1] - d1[1]) * frac];
            addDimLabel(mid[0], mid[1], text, basis);
        }

        /** Draw a radial dimension (centre → edge) for an arc/circle, with a label near the tip. */
        function addRadialDimension(cx, cy, r, angle, text, basis) {
            const ex = cx + r * Math.cos(angle);
            const ey = cy + r * Math.sin(angle);
            addLine(localLine([[cx, cy], [ex, ey]], basis), DIM_COLOR, LW, Z_DIMENSION);
            const lx = cx + (r + 1.5) * Math.cos(angle);
            const ly = cy + (r + 1.5) * Math.sin(angle);
            addDimLabel(lx, ly, text, basis);
        }


        function renderPitch(basis, flyCamera) {
            clearPitch();
            currentPitchBasis = {
                U: Cesium.Cartesian3.clone(basis.U),
                V: Cesium.Cartesian3.clone(basis.V),
                origin: Cesium.Cartesian3.clone(basis.origin),
            };

            // Width-dependent marking positions, recomputed from the current
            // PITCH_W so edits to the size inputs take effect immediately.
            const PA_Y0 = (PITCH_W - PA_WIDTH) / 2;
            const PA_Y1 = PA_Y0 + PA_WIDTH;
            const GA_Y0 = (PITCH_W - GA_WIDTH) / 2;
            const GA_Y1 = GA_Y0 + GA_WIDTH;

            // ── Background: alternating green stripes ──
            const stripeW = PITCH_L / STRIPE_N;
            const darkGreen  = Cesium.Color.fromCssColorString("#3a7d2c").withAlpha(1);
            const lightGreen = Cesium.Color.fromCssColorString("#4fa832").withAlpha(1);
            for (let i = 0; i < STRIPE_N; i++) {
                const x0 = i * stripeW;
                const x1 = x0 + stripeW;
                const col = (i % 2 === 0) ? darkGreen : lightGreen;
                addPolygon([
                    local2world(x0, 0,       basis),
                    local2world(x1, 0,       basis),
                    local2world(x1, PITCH_W, basis),
                    local2world(x0, PITCH_W, basis),
                ], col, Z_STRIPE);
            }

            // ── Outer boundary ──
            addLine([
                local2world(0,       0,       basis),
                local2world(PITCH_L, 0,       basis),
                local2world(PITCH_L, PITCH_W, basis),
                local2world(0,       PITCH_W, basis),
                local2world(0,       0,       basis),
            ], Cesium.Color.WHITE, LW_THICK, Z_MARKING);

            // ── Centre line ──
            addLine([
                local2world(PITCH_L / 2, 0,       basis),
                local2world(PITCH_L / 2, PITCH_W, basis),
            ], Cesium.Color.WHITE, LW, Z_MARKING);

            // ── Centre circle ──
            addLine(
                arcPoints(PITCH_L / 2, PITCH_W / 2, CENTER_R, 0, Math.PI * 2, 64, basis),
                Cesium.Color.WHITE, LW, Z_MARKING
            );

            // ── Centre spot ──
            addLine(
                arcPoints(PITCH_L / 2, PITCH_W / 2, 0.4, 0, Math.PI * 2, 16, basis),
                Cesium.Color.WHITE, 3, Z_MARKING
            );

            // ── Corner arcs ──
            // bottom-left (0,0): arc from 0° to 90°
            addLine(arcPoints(0,       0,       CORNER_R, 0,            Math.PI / 2,     12, basis), Cesium.Color.WHITE, LW, Z_MARKING);
            // bottom-right (L,0): arc from 90° to 180°
            addLine(arcPoints(PITCH_L, 0,       CORNER_R, Math.PI / 2,  Math.PI,         12, basis), Cesium.Color.WHITE, LW, Z_MARKING);
            // top-right (L,W): arc from 180° to 270°
            addLine(arcPoints(PITCH_L, PITCH_W, CORNER_R, Math.PI,      Math.PI * 3 / 2, 12, basis), Cesium.Color.WHITE, LW, Z_MARKING);
            // top-left (0,W): arc from 270° to 360°
            addLine(arcPoints(0,       PITCH_W, CORNER_R, Math.PI * 3 / 2, Math.PI * 2,  12, basis), Cesium.Color.WHITE, LW, Z_MARKING);

            // ─── LEFT END ────────────────────────────────────────────────────

            // Left penalty area
            addLine(localLine([
                [0,        PA_Y0],
                [PA_DEPTH, PA_Y0],
                [PA_DEPTH, PA_Y1],
                [0,        PA_Y1],
            ], basis), Cesium.Color.WHITE, LW, Z_MARKING);

            // Left goal area
            addLine(localLine([
                [0,        GA_Y0],
                [GA_DEPTH, GA_Y0],
                [GA_DEPTH, GA_Y1],
                [0,        GA_Y1],
            ], basis), Cesium.Color.WHITE, LW, Z_MARKING);

            // Left penalty spot
            addLine(
                arcPoints(PEN_SPOT_X, PITCH_W / 2, 0.4, 0, Math.PI * 2, 16, basis),
                Cesium.Color.WHITE, 3, Z_MARKING
            );

            // Left penalty arc (part of circle outside penalty area, i.e. x > PA_DEPTH)
            {
                const dx   = PA_DEPTH - PEN_SPOT_X;      // = 1
                const half = Math.acos(dx / PEN_ARC_R);  // half-angle of arc chord
                addLine(
                    arcPoints(PEN_SPOT_X, PITCH_W / 2, PEN_ARC_R, -half, half, 32, basis),
                    Cesium.Color.WHITE, LW, Z_MARKING
                );
            }

            // ─── RIGHT END ───────────────────────────────────────────────────
            const RP = PITCH_L - PEN_SPOT_X;   // right penalty spot x = 57

            // Right penalty area
            addLine(localLine([
                [PITCH_L,           PA_Y0],
                [PITCH_L - PA_DEPTH, PA_Y0],
                [PITCH_L - PA_DEPTH, PA_Y1],
                [PITCH_L,           PA_Y1],
            ], basis), Cesium.Color.WHITE, LW, Z_MARKING);

            // Right goal area
            addLine(localLine([
                [PITCH_L,           GA_Y0],
                [PITCH_L - GA_DEPTH, GA_Y0],
                [PITCH_L - GA_DEPTH, GA_Y1],
                [PITCH_L,           GA_Y1],
            ], basis), Cesium.Color.WHITE, LW, Z_MARKING);

            // Right penalty spot
            addLine(
                arcPoints(RP, PITCH_W / 2, 0.4, 0, Math.PI * 2, 16, basis),
                Cesium.Color.WHITE, 3, Z_MARKING
            );

            // Right penalty arc (x < PITCH_L - PA_DEPTH)
            {
                const dx   = RP - (PITCH_L - PA_DEPTH); // = 1
                const half = Math.acos(dx / PEN_ARC_R);
                // Arc faces left (toward x < PITCH_L - PA_DEPTH), so angles around π
                addLine(
                    arcPoints(RP, PITCH_W / 2, PEN_ARC_R, Math.PI - half, Math.PI + half, 32, basis),
                    Cesium.Color.WHITE, LW, Z_MARKING
                );
            }

            // ─── Dimension lines ─────────────────────────────────────────────
            if (showDimensions) {
                const CX = PITCH_L / 2, CY = PITCH_W / 2;

                // Stack of spans measured along the x-axis (depth into the pitch),
                // offset outward beyond the y=0 touchline (negative y). These
                // spans start at different lengths (GA_DEPTH < PA_DEPTH <
                // PITCH_L), so their midpoints naturally don't collide.
                addLinearDimension([0, 0], [GA_DEPTH, 0], [0, -3],  `${GA_DEPTH}m`, basis);
                addLinearDimension([0, 0], [PA_DEPTH, 0], [0, -8],  `${PA_DEPTH}m`, basis);
                addLinearDimension([0, 0], [PITCH_L, 0],  [0, -14], `${PITCH_L}m`, basis);

                // Stack of spans measured along the y-axis (pitch width),
                // offset outward beyond the x=0 goal line (negative x).
                // Label positions are staggered (labelFrac) because all three
                // spans share the same centre (PITCH_W / 2) and would
                // otherwise overlap.
                addLinearDimension([0, GA_Y0], [0, GA_Y1], [-3, 0],  `${GA_WIDTH}m`, basis, 0.5);
                addLinearDimension([0, PA_Y0], [0, PA_Y1], [-8, 0],  `${PA_WIDTH}m`, basis, 0.22);
                addLinearDimension([0, 0], [0, PITCH_W],   [-14, 0], `${PITCH_W}m`, basis, 0.78);

                // Penalty spot distance from the goal line
                addLinearDimension([0, CY], [PEN_SPOT_X, CY], [0, -2], `${PEN_SPOT_X}m`, basis);

                // Radii
                addRadialDimension(PEN_SPOT_X, CY, PEN_ARC_R, Cesium.Math.toRadians(45), `R${PEN_ARC_R}m`, basis);
                addRadialDimension(CX, CY, CENTER_R, Cesium.Math.toRadians(135), `R${CENTER_R}m`, basis);
                addRadialDimension(0, 0, CORNER_R, Cesium.Math.toRadians(45), `R${CORNER_R}m`, basis);
            }

            // ── Fly to pitch ──
            const pitchCorners = [
                local2world(0, 0, basis),
                local2world(PITCH_L, 0, basis),
                local2world(PITCH_L, PITCH_W, basis),
                local2world(0, PITCH_W, basis),
            ];
            const pitchBounds = Cesium.BoundingSphere.fromPoints(pitchCorners);

            if (flyCamera) {
                viewer.camera.flyToBoundingSphere(pitchBounds, {
                    offset: new Cesium.HeadingPitchRange(
                        0,
                        Cesium.Math.toRadians(-90),
                        Math.max(pitchBounds.radius * 3, 140)
                    ),
                    duration: 1.5,
                });
            }
        }

        function drawPitch(p1, p2, p3) {
            renderPitch(buildBasis(p1, p2, p3), true);
        }
    </script>
</body>
</html>
